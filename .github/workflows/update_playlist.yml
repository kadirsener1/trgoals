name: M3U Playlist Güncelleyici

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repoyu Klonla
        uses: actions/checkout@v4

      - name: 🐍 Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Bağımlılıkları Yükle
        run: pip install -r requirements.txt

      # ── Playwright sistem bağımlılıkları (GitHub runner için zorunlu) ──
      - name: 🎭 Playwright Chromium Kur
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: ▶️ Scripti Çalıştır
        run: python fetch_m3u.py

      - name: 💾 Commit & Push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u last_known_domain.json
          git diff --cached --quiet || git commit -m "🔄 Playlist güncellendi [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
